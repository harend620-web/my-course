<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f9f9f9;
      color: #333;
    }

    /* Header & Navbar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #fff;
            box-shadow: 0 2px 5px rgba(245, 0, 0, 0.10196078431372549);
        }


        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #fc0822;
        }

        .logo span {
            color: #1211fa;
        }

        

    /* Hero Section */
    .hero {
      text-align: center;
      padding: 40px 20px;
      background: #f4f5f7;
      margin: 15px;
      border-radius: 8px;
    }

    .hero h1 {
      font-size: 1.8rem;
      color: #2e7d32;
      margin-bottom: 10px;
      line-height: 1.4;
    }

    .hero p {
      font-size: 1rem;
      font-weight: 600;
      color: #222;
      margin-bottom: 25px;
    }

    .btn-all-courses {
      display: inline-block;
      padding: 12px 25px;
      background: #0288d1;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1rem;
    }

    /* Courses Section */
        .courses-section {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .courses-section h2 {
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }

        .course-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .course-card {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
            padding-bottom: 15px;
        }

        .course-img {
            width: 100%;
            height: 150px;
            background-color: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #6c757d;
        }

        .course-card h3 {
            font-size: 16px;
            margin: 15px 10px 5px;
        }

        .price {
            margin: 10px 0;
            font-size: 16px;
        }

        .original-price {
  text-decoration: line-through;
            color: #888;
            margin-right: 8px;
        }

        .discount-price {
            color: #d9534f;
            font-weight: bold;
        }

        .btn-cart {
            display: inline-block;
            background-color: #016327;
            color: #ffffff;
            padding: 8px 15px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 14px;
        }
    
.bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 40px;
            background: hwb(0 84% 5%);
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 -2px 10px rgba(20, 0, 0, 0.10196078431372549);
        }

        .bottom-nav a {
            text-decoration: none;
            color: #000000;
            font-size: 12px;
            text-align: center;
          font-weight: bold;
        }

        .bottom-nav a.active {
            color: #000000fd;
            font-weight: bold;
        }

  </style>
</head>
<body>
      
    <!-- Header -->
    <header>
        <div class="logo"><b>Harendra</b> <span><b>Academy</b></span></div>
        <a href="index.html" class="btn-register">🏠</a>
  <a href="profile.html">👤My Profile</a>
    </header>


<!-- Featured Courses -->
    <section class="courses-section" id="courses">
        <h2>All Courses</h2>
        <div class="course-grid">
            
            <!-- Course 1 -->
            <div class="course-card">
                <img src="basiccomputer.png" width="315" height="140">
                <h3><a href="basic computer.html">Basic Computer Full Course</a></h3>
                <div class="price">
                    <span class="original-price">₹500</span>
                    <span class="discount-price">₹200</span>
                </div>
                <a href="payment.html" class="btn-cart"><b>Enroll Now</b></a>
            </div>

            <!-- Course 2 -->
            <div class="course-card">
                <img src="ai.png" width="315" height="140">
              <h3><a href="aicontent.html">Artificial Intelligence Full Course</a></h3>
            
                <div class="price">
                    <span class="original-price">₹1000</span>
                    <span class="discount-price">₹399</span>
                </div>
                <a href="payment.html" class="btn-cart">Enroll Now</a>
            </div>

            <!-- Course 3 -->
            <div class="course-card">
             <img src="engspeak.png" width="315" height="140">
                <h3>English Speaking Full Course</h3>
                <div class="price">
                    <span class="original-price">₹1000</span>
                    <span class="discount-price">₹250</span>
                </div>
                <a href="payment.html" class="btn-cart">Enroll Now</a>
            </div>

        </div>
    </section>
<div class="bottom-nav">

        <a href="#" class="active">
            🏠<br>Home
        </a>
<a href="course.html">
    🛒<br>Courses
</a>

</div>
</body>
</html>
